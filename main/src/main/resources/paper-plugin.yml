name: PDC-Engine
version: 1.5-Alpha-1
main: dev.itsrealperson.permadeath.Main
bootstrapper: dev.itsrealperson.permadeath.PermadeathBootstrap
loader: dev.itsrealperson.permadeath.PermadeathLoader
api-version: 1.21
folia-supported: true
authors: [ SebazCRC, vo1d_dev, ItsRealPerson ]
description: Programmable Dynamic Core - The Universal Game Logic Engine.
website: https://github.com/ItsRealPerson/Permadeath

dependencies:
  server:
    BetterModel:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  permadeath.admin:
    description: Permite usar comandos de administración
    default: op

commands:
  pdc:
    description: PDC-Engine Main Command
    aliases: [ permadeath, engine ]
