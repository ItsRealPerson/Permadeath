# Configuración de Sharding (Mundo Distribuido)
# Permite dividir el Overworld en múltiples servidores.

# ID de este servidor en la configuración de abajo.
CurrentShardID: "shard-1"

# Servidor por defecto (si un jugador está en tierra de nadie).
FallbackServer: "shard-1"

# Protocolo de Semilla Global
# Si está presente, el plugin verificará que la semilla del mundo coincida con esta.
# Network.GlobalSeed: 123456789

# Dimensional Hosting
# Define qué servidor de la red hostea cada dimensión.
# Si un jugador entra en un portal de una dimensión no hosteada localmente, 
# será transferido automáticamente al servidor correspondiente.
DimensionalHosting:
  world_the_end: "shard-1"
  pdc_the_beginning: "shard-1"
  pdc_the_abyss: "shard-1"

# Definición de zonas (Overworld Sharding)
Shards:
  shard-1:
    ProxyName: "survival-1"  # Nombre en el Proxy (Velocity/Bungee)
    Bounds:
      MinX: -10000
      MaxX: -1
      MinZ: -10000
      MaxZ: 10000
  shard-2:
    ProxyName: "survival-2"
    Bounds:
      MinX: 0
      MaxX: 10000
      MinZ: -10000
      MaxZ: 10000
